# Borrjournal. En container, SQLite. Inga förberedelser, inget lösenord till någon databas.
#
#   cp .env.example .env      (fyll i två hemligheter)
#   docker compose up -d --build
#
# Allt ligger i volymen "data": databasfilen, uppladdade filer, tumnaglar och backuper.

services:
  app:
    build: ./backend
    container_name: borrjournal-app
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/borrjournal.db
      SECRET_KEY: ${SECRET_KEY:?sätt SECRET_KEY i .env}
      DATA_DIR: /data
      TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-12}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?sätt BOOTSTRAP_PASSWORD i .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      # Signeringstjänsten. Utan dessa är funktionen avstängd.
      SIGNERING_URL: ${SIGNERING_URL:-}
      SIGNERING_NYCKEL: ${SIGNERING_NYCKEL:-}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-Borrjournal}
      ALLOW_CHALLENGE_SCRIPTS: ${ALLOW_CHALLENGE_SCRIPTS:-false}
      CSP_EXTRA_SOURCES: ${CSP_EXTRA_SOURCES:-}
      SECURITY_HEADERS: ${SECURITY_HEADERS:-true}
    volumes:
      - data:/data
      - ./frontend:/app/frontend:ro
    # Appen klarar sig utan signeringstjänsten, men startar den finns är det
    # snyggast att den är uppe först.
    depends_on:
      signering:
        condition: service_started
    ports:
      # Kör nginx i en egen container når den inte 127.0.0.1 på värden, därför
      # är 0.0.0.0 standard. Se avsnittet Säkerhet i README för hur du stänger
      # porten mot omvärlden utan att bryta proxyn.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s


  # Signeringstjänsten. Egen container, egen databas, egen domän.
  # Kan inte nå Borrjournal, bara svara när Borrjournal frågar.
  signering:
    build: ./signering
    container_name: borrjournal-signering
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/signering.db
      SHARED_SECRET: ${SIGNERING_NYCKEL}
      PUBLIC_URL: ${SIGNERING_URL_PUBLIK}
      TSA_URL: ${TSA_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    volumes:
      - signering:/data
    ports:
      - "${SIGNERING_BIND:-0.0.0.0}:${SIGNERING_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/halsa"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  signering:
  data:
