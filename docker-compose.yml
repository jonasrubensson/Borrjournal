services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: borrjournal
      POSTGRES_USER: borrjournal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?sätt POSTGRES_PASSWORD i .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borrjournal -d borrjournal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  app:
    build: ./backend
    container_name: borrjournal-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://borrjournal:${POSTGRES_PASSWORD}@db:5432/borrjournal
      SECRET_KEY: ${SECRET_KEY:?sätt SECRET_KEY i .env}
      DATA_DIR: /data
      TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-12}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?sätt BOOTSTRAP_PASSWORD i .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      # Backuper hamnar under /data/backups, dvs. i samma volym som filerna.
      # Montera gärna en extern sökväg dit om du vill ha dem utanför Docker.
    volumes:
      - files:/data
      - ./frontend:/app/frontend:ro
    networks: [internal, proxy]
    # Bind bara mot loopback eller ett internt nätkort. HTTPS terminerar i
    # Nginx Proxy Manager, appen ska aldrig ligga öppen mot internet.
    ports:
      - "${APP_BIND:-127.0.0.1:8000}:8000"

volumes:
  db-data:
  files:

networks:
  internal:
    internal: true
  # Delat nätverk med Nginx Proxy Manager. Skapa det en gång:
  #   docker network create proxy
  # Då kan NPM peka på hostname "borrjournal-app" port 8000 utan att gå via värdens IP.
  proxy:
    external: true
    name: proxy
