name: Bygg och publicera

# Bygger båda imagerna och lägger dem i GitHub Container Registry, så att en
# uppdatering på servern bara blir "docker compose pull && docker compose up -d".
#
# Körs vid push till main och när en version taggas. En taggad version ger även
# en image med det versionsnumret, så att det går att gå tillbaka.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  bygg:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - namn: borrjournal
            kontext: .
            dockerfile: backend/Dockerfile
          - namn: borrjournal-signering
            kontext: ./signering
            dockerfile: ./signering/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Registret kräver små bokstäver, men GitHub-konton kan ha versaler.
      # Utan det här faller publiceringen på "must be lowercase".
      - name: Gör ägarnamnet till små bokstäver
        id: agare
        run: echo "namn=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Logga in mot registret
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ta fram taggar
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.agare.outputs.namn }}/${{ matrix.namn }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Sätt upp buildx
        uses: docker/setup-buildx-action@v3

      - name: Bygg och publicera
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.kontext }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
