<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1F2A">
<title>Borrjournal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 26'><path d='M10 1 L10 25' stroke='%231F7A8C' stroke-width='2'/><path d='M4 7h12M4 13h12M4 19h12' stroke='%235E7C87' stroke-width='1.4'/></svg>">
<!-- Inga externa resurser. Appen ska fungera på ett internt nät utan internet.
     Ett typsnitt från ett CDN som inte går att nå blockerar körningen av skript
     tills webbläsaren ger upp, och då står allt still. -->
<link rel="stylesheet" href="/static/styles.css">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Borrjournal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<noscript>
  <div style="max-width:32rem;margin:15vh auto;padding:1.5rem;font-family:system-ui,sans-serif;
              border:1px solid #D3DBDC;border-radius:3px">
    <h1 style="font-size:1.2rem;margin:0 0 .5rem">JavaScript krävs</h1>
    <p style="margin:0;color:#33505E">Borrjournal behöver JavaScript påslaget för att fungera.</p>
  </div>
</noscript>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  // Visar fel på skärmen i stället för att sidan bara blir tom.
  window.addEventListener("error", function (e) {
    var box = document.getElementById("bootfel");
    if (!box) return;
    box.hidden = false;
    box.textContent = "Fel i gränssnittet: " + (e.message || e.type) +
      (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "");
  });
</script>
<div id="bootfel" hidden style="position:fixed;left:0;right:0;bottom:0;z-index:200;background:#7E2E20;
     color:#fff;padding:10px 14px;font:13px/1.4 ui-monospace,monospace"></div>
<script src="/static/app.js"></script>
</body>
</html>
