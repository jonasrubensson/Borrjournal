# Exempel på nginx-konfiguration för Borrjournal bakom mTLS.
#
# Appen sätter redan sina egna säkerhetsheaders och kontrollerar sökvägar, så
# den här filen är ett komplement, inte en förutsättning. Det som verkligen
# behöver göras här är tre saker:
#
#   1. HSTS, som bara kan sättas av den som terminerar TLS
#   2. korrekt X-Forwarded-For, annars loggas proxyns IP i stället för besökarens
#   3. rimliga gränser för uppladdning och timeout
#
# Kör du Nginx Proxy Manager läggs innehållet under "Advanced" på proxyn.

server {
    listen 443 ssl http2;
    server_name borrjournal.dinfirma.se;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/borrjournal.dinfirma.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/borrjournal.dinfirma.se/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- klientcertifikat (mTLS) ----
    # Alla som når appen måste ha ett certifikat utfärdat av er egen CA.
    ssl_client_certificate /etc/nginx/certs/borrjournal-ca.pem;
    ssl_crl                /etc/nginx/certs/borrjournal-ca.crl;   # spärrlista, viktig
    ssl_verify_client on;
    ssl_verify_depth 2;

    # ---- headers som bara proxyn kan sätta ----
    # HSTS gäller hela domänen och kräver att TLS terminerar här.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Appen sätter CSP, X-Frame-Options och övriga själv. Sätt dem inte igen här,
    # två olika värden på samma header ger oförutsägbart resultat i webbläsaren.

    # Dölj vilken version av nginx som körs
    server_tokens off;

    # ---- gränser ----
    client_max_body_size 50m;      # uppladdade foton och borrprotokoll
    client_body_timeout 60s;
    send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Utan detta ser appen bara proxyns IP, och inloggningsloggen blir
        # meningslös. Sätt alltid, skriv aldrig vidare klientens egna värde.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Vem certifikatet tillhör, användbart i loggen
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;

        proxy_read_timeout 300s;    # SGU-hämtning och backup kan ta tid
        proxy_buffering off;        # för nedladdning av backuper
    }

    # Hälsokontrollen behöver inte klientcertifikat, så att övervakning fungerar
    location = /api/health {
        ssl_verify_client off;
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}

# Allt på port 80 vidare till TLS
server {
    listen 80;
    server_name borrjournal.dinfirma.se;
    return 301 https://$host$request_uri;
}
